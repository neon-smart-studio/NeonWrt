[Unit]
# NeonWrt/OpenWrt has /dev/ttyAMA0 from devtmpfs before PID 1, but the
# systemd dev-ttyAMA0.device state is not reliable in this hybrid userspace.
# Clear the template's device binding/order so serial login never waits 90s.
BindsTo=
After=
After=systemd-user-sessions.service getty-pre.target
ConditionPathExists=/dev/ttyAMA0

[Service]
ExecStart=
ExecStart=-/usr/sbin/agetty --autologin root --noclear --keep-baud 115200,57600,38400,9600 - $TERM
